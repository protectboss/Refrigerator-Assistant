<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="冰箱助手" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>冰箱助手</title>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <span>冰箱助手</span>
      <button id="open-settings" class="header-btn">设置</button>
    </header>

    <main>
      <!-- 冰箱库存 -->
      <section id="view-inventory" class="view">
        <div id="banner"></div>
        <div id="notify-tip"></div>
        <div id="summary"></div>
        <div id="inventory-list"></div>
      </section>

      <!-- 今日吃什么 -->
      <section id="view-recipes" class="view hidden">
        <div id="recipes-wrap"></div>
      </section>

      <!-- 问问 AI -->
      <section id="view-chat" class="view hidden">
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-bar">
          <button id="chat-mode-toggle" aria-label="切换语音或键盘输入">
            <svg id="icon-to-voice" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
            </svg>
            <svg id="icon-to-keyboard" class="hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <line x1="6" y1="9" x2="6" y2="9.01"/>
              <line x1="10" y1="9" x2="10" y2="9.01"/>
              <line x1="14" y1="9" x2="14" y2="9.01"/>
              <line x1="18" y1="9" x2="18" y2="9.01"/>
              <line x1="7" y1="15" x2="17" y2="15"/>
            </svg>
          </button>
          <input id="chat-input" type="text" placeholder="问问今天吃什么…" autocomplete="off" />
          <button id="chat-send">发送</button>
          <button id="chat-hold" class="hidden"><span>按住 说话</span></button>
        </div>
      </section>
    </main>

    <button id="voice-fab" aria-label="按住说话记账">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button id="scan-fab" aria-label="拍照识别添加">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
    <button id="fab" aria-label="添加菜品">+</button>
    <input id="scan-file" type="file" accept="image/*" class="hidden" />

    <!-- 批量操作栏 -->
    <div id="batch-bar" class="batch-bar hidden">
      <button id="batch-all" class="batch-link">全选</button>
      <span id="batch-count" class="batch-count">已选 0</span>
      <button id="batch-eaten" class="batch-btn" disabled>吃完了</button>
      <button id="batch-wasted" class="batch-btn" disabled>扔掉了</button>
      <button id="batch-delete" class="batch-btn batch-danger" disabled>删除</button>
    </div>

    <nav class="tabbar">
      <button class="tab active" data-view="inventory">冰箱库存</button>
      <button class="tab" data-view="recipes">今日吃什么</button>
      <button class="tab" data-view="chat">问问AI</button>
    </nav>

    <!-- 录入 / 编辑面板 -->
    <div id="form-panel" class="panel hidden">
      <header class="panel-header">
        <button id="form-back" aria-label="返回">‹ 返回</button>
        <span id="form-title">记一样菜</span>
      </header>
      <div class="form card">
        <div class="field">
          <label class="label" for="f-name">菜品名称</label>
          <input id="f-name" type="text" placeholder="如:菠菜、土豆、猪肉" autocomplete="off" />
          <div id="suggestions" class="suggestions hidden"></div>
        </div>
        <div id="kb-hint" class="kb-hint hidden"></div>
        <div class="field">
          <label class="label" for="f-location">保存位置</label>
          <select id="f-location">
            <option value="冷藏">冷藏</option>
            <option value="冷冻">冷冻</option>
            <option value="常温">常温</option>
          </select>
        </div>
        <div class="field">
          <label class="label" for="f-date">到期日期</label>
          <input id="f-date" type="date" />
        </div>
        <div class="field">
          <label class="label" for="f-advice">保存建议</label>
          <textarea id="f-advice" rows="2" maxlength="100" placeholder="怎么保存更久(选中菜品后自动填写)"></textarea>
        </div>
      </div>
      <button id="form-save" class="primary-btn">放入冰箱</button>
    </div>

    <!-- 菜品操作菜单 -->
    <div id="sheet-mask" class="mask hidden">
      <div class="sheet">
        <div id="sheet-title" class="sheet-title"></div>
        <button class="sheet-btn" data-action="eaten">吃完了</button>
        <button class="sheet-btn" data-action="wasted">扔掉了</button>
        <button class="sheet-btn" data-action="edit">编辑</button>
        <button class="sheet-btn sheet-cancel" data-action="cancel">取消</button>
      </div>
    </div>

    <!-- 设置面板 -->
    <div id="settings-panel" class="panel hidden">
      <header class="panel-header">
        <button id="settings-back" aria-label="返回">‹ 返回</button>
        <span>设置</span>
      </header>
      <div class="form card">
        <div class="field">
          <label class="label" for="f-familycode">家庭共享码</label>
          <input id="f-familycode" type="text" placeholder="如:wang-jia-2026(至少 4 个字符)" autocomplete="off" />
        </div>
        <div class="field">
          <label class="label" for="f-apikey">阿里云百炼 API Key</label>
          <input id="f-apikey" type="password" placeholder="sk-..." autocomplete="off" />
        </div>
      </div>
      <div class="settings-note">
        <b>家庭共享:</b>全家设备填同一个共享码,冰箱库存、购物清单就会自动同步;共享码相当于钥匙,
        请设置一个别人猜不到的(建议带数字和自己家的专属词)。留空则数据只存在本机。<br /><br />
        <b>API Key:</b>只保存在你这台设备的浏览器里,不会上传到任何服务器或代码仓库;调用 AI 时经由你自己的
        Cloudflare Worker 直接转发给阿里云。获取方式:阿里云百炼控制台 → API-KEY 管理 → 创建。
        AI 对话、拍照识别、小票识别三个功能都需要它。
      </div>
      <button id="settings-save" class="primary-btn">保存</button>
    </div>

    <!-- 拍照/语音识别结果确认 -->
    <div id="scan-panel" class="panel hidden">
      <header class="panel-header">
        <button id="scan-back" aria-label="返回">‹ 返回</button>
        <span id="scan-title">识别到这些食材</span>
      </header>
      <div id="scan-note" class="settings-note">取消勾选不需要的,确认后按知识库自动设置保质期放入冰箱。</div>
      <div id="scan-list" class="scan-list card"></div>
      <button id="scan-confirm" class="primary-btn">确认执行</button>
    </div>

    <!-- 全屏加载遮罩 -->
    <div id="loading-mask" class="loading-mask hidden">
      <div class="loading-box" id="loading-text">正在识别…</div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
